[package]
name = "tableboat"
version = "0.1.0"
description = "A small, fast database client"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
keyring-core = "1"
windows-native-keyring-store = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
frizbee = "0.13"
futures-util = "0.3"
csv = "1.4"
rust_xlsxwriter = "0.102"
tiny_http = "0.12"
mongodb = "3.10"

[profile.release]
# "thin" LTO in parallel units: builds several times faster and needs far less RAM than full
# LTO with one unit, for a nearly identical app.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[package]
name = "tableboat"
version = "0.1.0"
description = "A small, fast database client"
license = "MIT"
repository = "https://github.com/yash-desai-naik/tableboat"
edition = "2024"
publish = false
default-run = "tableboat"

# The code with no window in it (connections, databases, settings, Claude helpers, the MCP
# tool server), shared by the desktop app and the `tb` command line.
[lib]
name = "tableboat_core"
path = "src/lib.rs"

# The desktop app.
[[bin]]
name = "tableboat"
path = "src/main.rs"

# The command line: `tb connections`, `tb query`, `tb ask`… (installed next to the app).
[[bin]]
name = "tb"
path = "src/bin/tb/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.41", features = ["bundled", "column_decltype"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
keyring-core = "1"
windows-native-keyring-store = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
frizbee = "0.13"
futures-util = "0.3"
csv = "1.4"
rust_xlsxwriter = "0.102"
tiny_http = "0.12"
mongodb = "3.10"
# Already in the build (via other crates): images attached to Claude messages.
base64 = "0.22"
# Already in the build: %APPDATA% without needing Tauri (the `tb` command line).
dirs = "7"
# The `tb` command line's arguments and help.
clap = { version = "4", features = ["derive"] }
# Updates from GitHub releases, signature-checked against the key in tauri.conf.json.
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Already built for Tauri's windowing; used for the window's "Restore Down" rectangle and to
# open Windows voice typing (Win+H) from the Claude pane's mic button.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Console"] }

[profile.release]
# "thin" LTO in parallel units: builds several times faster and needs far less RAM than full
# LTO with one unit, for a nearly identical app.
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
